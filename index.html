<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Kn9QmAcN2GnB1vtoBNf-HKBRjgHq9HLzdScUeC0sKi8" />
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <title>MiramoreNow – Food & Shopping</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a5c2a" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; overflow-x: hidden; }
      #root { width: 100%; min-height: 100vh; }
    </style>

    <!-- Google Maps Loader – robust for mobile -->
    <script>
      (function() {
        // Dispatch the custom event only when Places API is truly ready
        function dispatchReady() {
          if (window.google && window.google.maps && window.google.maps.places) {
            console.log("✅ Google Maps & Places API fully loaded");
            window.dispatchEvent(new Event("google-maps-loaded"));
            return true;
          }
          return false;
        }

        // Fallback: if the script fails, retry after 2 seconds (up to 3 times)
        let retryCount = 0;
        const maxRetries = 3;

        function loadGoogleMaps() {
          const script = document.createElement("script");
          script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyAcgWyOPX7Y1qY98BolRvjPqwMuSs6prfY&libraries=places,geometry&callback=initGoogleMaps";
          script.onerror = function() {
            console.warn("Google Maps script failed to load, retrying...");
            if (retryCount < maxRetries) {
              retryCount++;
              setTimeout(loadGoogleMaps, 2000);
            } else {
              console.error("Google Maps failed after multiple retries");
              // Still dispatch an event to avoid blocking the UI
              window.dispatchEvent(new Event("google-maps-failed"));
            }
          };
          document.head.appendChild(script);
        }

        window.initGoogleMaps = function() {
          // The callback may fire before `places` is attached
          if (!dispatchReady()) {
            // Poll for up to 3 seconds to ensure Places API is present
            let attempts = 0;
            const interval = setInterval(function() {
              if (dispatchReady()) {
                clearInterval(interval);
              } else if (attempts >= 10) { // 10 * 300ms = 3 seconds
                clearInterval(interval);
                console.warn("Places API not available after callback");
                window.dispatchEvent(new Event("google-maps-failed"));
              }
              attempts++;
            }, 300);
          }
        };

        // Start loading immediately
        loadGoogleMaps();
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Flutterwave (no changes needed) -->
    <script>
      (function () {
        if (window.FlutterwaveCheckout) return;
        var s = document.createElement("script");
        s.src = "https://checkout.flutterwave.com/v3.js";
        s.async = true;
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
